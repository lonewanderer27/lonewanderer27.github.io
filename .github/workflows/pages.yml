name: Build and deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # MUST precede the Jekyll build: this writes assets/css/main.css, which
      # Jekyll then copies into docs/.
      - run: pnpm css:build

      # A missing or mis-scoped Tailwind build produces an unstyled page, not
      # an error, so fail loudly here instead of shipping a broken site.
      # The floor is deliberately low while Bootstrap still carries most of the
      # styling and few templates are converted; raise it at teardown, when
      # Tailwind becomes the only stylesheet and the output grows several-fold.
      - name: Check tailwind output is not empty
        run: |
          floor=20000
          size=$(wc -c < assets/css/main.css)
          echo "assets/css/main.css = ${size} bytes (floor ${floor})"
          if [ "$size" -lt "$floor" ]; then
            echo "::error::Tailwind output is only ${size} bytes (<${floor})." \
                 "The @source globs in _tailwind/main.css probably match nothing."
            exit 1
          fi

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1.2' # matches .ruby-version
          bundler-cache: true

      - run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs # matches destination: docs/ in _config.yml

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
