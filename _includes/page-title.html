{%- comment -%}
  Page-title banner shared by the page and post layouts.
  Params: heading (h1|h3), title, transition (view-transition-name)
{%- endcomment -%}
<section class="bg-primary relative pt-30 pb-12.5 sm:py-45 lg:pt-62.5 lg:pb-37.5">
  <div class="container-page relative z-1">
    <div class="flex flex-wrap -mx-3.75">
      <div class="relative w-full px-3.75 text-center">
        {% if include.heading == "h3" %}
        <h3 class="text-h3 font-secondary text-white">{{ include.title }}</h3>
        {% else %}
        <h1 class="text-h1 font-secondary text-white"{% if include.transition %} style="view-transition-name: {{ include.transition }};"{% endif %}>{{ include.title }}</h1>
        {% endif %}
      </div>
    </div>
  </div>
  <!-- background shapes -->
  <img src="{{ site.baseurl }}/assets/images/illustrations/page-title.png" alt="illustrations" class="max-w-full h-auto absolute left-0 bottom-0 w-full">
  <img src="{{ site.baseurl }}/assets/images/illustrations/leaf-pink-round.png" alt="illustrations" class="max-w-full h-auto absolute -left-5 -top-2.5">
  <img src="{{ site.baseurl }}/assets/images/illustrations/dots-cyan.png" alt="illustrations" class="max-w-full h-auto absolute left-[10%] top-25">
  <img src="{{ site.baseurl }}/assets/images/illustrations/leaf-orange.png" alt="illustrations" class="max-w-full h-auto absolute left-1/2 -top-5 hidden sm:block">
  <img src="{{ site.baseurl }}/assets/images/illustrations/leaf-yellow.png" alt="illustrations" class="max-w-full h-auto absolute left-22.5 -bottom-12.5 rotate-180 hidden sm:block">
  <img src="{{ site.baseurl }}/assets/images/illustrations/dots-group-cyan.png" alt="illustrations" class="max-w-full h-auto absolute right-[20%] -bottom-5 hidden sm:block">
  <img src="{{ site.baseurl }}/assets/images/illustrations/leaf-cyan-lg.png" alt="illustrations" class="max-w-full h-auto absolute -right-55 -bottom-25 hidden sm:block">
</section>
