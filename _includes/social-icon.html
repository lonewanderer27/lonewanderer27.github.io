<!-- social icon -->
<!-- Each glyph sits in a brand-tinted material disc. This ADDS a surface
     rather than restyling one -- the rail was previously bare white links --
     and it is material-brand because the icons are text-white: a neutral
     material disc would leave white glyphs on a near-white ground.

     A horizontal row, not the old vertical stack pinned to the left gutter:
     the rail now sits directly under the heading as part of the hero's left
     column, so a column of discs floating in the margin has nothing to
     align to. -->
<ul class="flex items-center gap-3 list-none pl-0 mt-10 mb-0">
    {% for social in site.data.settings.social %}
    <li>
        <a
            class="text-white size-11 grid place-items-center rounded-full material-brand transition-all duration-200 ease-[ease] hover:bg-material-thick hover:text-heading focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary"
            href="{{ social.link }}"
            rel="{% if social.rel %}{{ social.rel }}{% endif %}"
            aria-label="{{ social.name | default: social.icon }}"
        >
            {% include ui/icon.html name=social.icon class="size-6" %}
        </a>
    </li>
    {% endfor %}
</ul>
