<!-- social icon -->
<ul class="list-none pl-0 ms-12! mt-[1rem]! relative z-[1]">
    {% for social in site.data.settings.social %}
    <li class="mb-[1rem] inline p-[15px] md:block md:p-0">
        <a 
            class="text-white" 
            href="{{ social.link }}" 
            rel="{% if social.rel %}{{ social.rel }}{% endif %}"
        >
            <i class="{{ social.icon }} text-[x-large] md:text-[length:inherit]"></i>
        </a>
    </li>
    {% endfor %}
</ul>
