{% if site.data.settings.team %}
<!-- team -->
<section class="py-5 sm:py-20">
  <div class="container-page">
    <div class="flex flex-wrap -mx-3.75">
      <div class="relative w-full px-3.75 text-center">
        <h2 class="text-h2 font-secondary mb-20">My Team</h2>
      </div>
      {% for team-member in site.data.settings.team %}
      <div class="relative w-full px-3.75 mb-6 md:mb-0 sm:w-1/2 md:w-1/3">
        <div class="relative flex flex-col min-w-0 wrap-break-word rounded-card material bg-clip-border text-center">
          <img src="{{ team-member.image | relative_url }}" class="w-full rounded-t-card">
          <div class="flex-auto p-5">
            <h4 class="text-h4 font-secondary mb-3">{{ team-member.title }}</h4>
            <p class="text-subtle font-secondary">{{ team-member.designation }}</p>
          </div>
        </div>
      </div>
      {% endfor %}
    </div>
  </div>
</section>
<!-- /team -->
{% endif %}
