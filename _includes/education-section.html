{% if site.data.settings.education %}
<!-- education -->
<section class="py-[20px] sm:py-20 relative">
  <div class="container-page">
    <div class="flex flex-wrap -mx-[15px]">
      <div class="relative w-full px-[15px] text-center">
        <h2 class="text-h2 font-secondary mb-20">{{ site.data.settings.education-title }}</h2>
      </div>
      {% for item in site.data.settings.education %}
      <div class="@container relative w-full px-[15px] mb-20 md:w-1/2">
        <!-- Stacks when the column is too narrow for an icon beside the text,
             which is the case in the two-up layout at tablet width. -->
        <div class="flex flex-col items-center text-center @min-[22rem]:flex-row @min-[22rem]:items-start @min-[22rem]:text-start">
          <div class="mb-4 @min-[22rem]:mb-0 @min-[22rem]:me-[1rem] @min-[32rem]:me-12">
            <i class="ti-medall text-[45px] text-icon-soft size-[100px] leading-[100px]! text-center bg-surface shadow-soft rounded-full block"></i>
          </div>
          <div>
            <p class="text-heading mb-1">{{ item.date }}</p>
            <h4 class="text-h4 font-secondary">
              {% if item.certificate %}
              <a href="{{ item.certificate }}" class="underline text-accent" title="View certificate">{{ item.name }}</a>
              {% else %}
              {{ item.name }}
              {% endif %}
            </h4>
            <p class="mb-0 text-muted">{{ item.organization }}</p>
          </div>
        </div>
      </div>
      {% endfor %}
    </div>
  </div>
  <!-- bg image -->
  <img class="max-w-full h-auto absolute left-0 top-[-300px] -z-10 w-full" src="{{ site.baseurl }}/assets/images/backgrounds/education-bg.png" alt="bg-image">
</section>
<!-- /education -->
{% endif %}
