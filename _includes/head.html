<head>
  <meta charset="utf-8">
  <title>{% if page.title %}{{ page.title }}{% else %}{{ site.data.settings.title }}{% endif %}</title>

  <!-- mobile responsive meta -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="description" content="{%if page.description%}{{page.description}}{%else%}{{site.data.settings.description}}{%endif%}">
  
  <!-- theme meta -->
  <meta name="theme-name" content="kross-jekyll" />

  <!-- additional metadata -->
  <meta property="og:image" content="{%if site.data.settings.logo %}{{ site.data.settings.banner | relative_url }}{%endif%}">
  <meta property="twitter:image" content="{%if site.data.settings.logo %}{{ site.data.settings.banner | relative_url }}{%endif%}">
  
  {% if site.author %}
  <meta name="author" content="{{ . }}">
  {% endif %}
  
  <!-- ** Plugins Needed for the Project ** -->
  {% for css in site.data.plugins.css %}
  <link rel="stylesheet" href="{{ css | relative_url }}">
  {% endfor %}

  <!-- Main Stylesheet. Built by `pnpm css:build`, not by Jekyll. -->
  <link href="{{ '/assets/css/main.css' | relative_url }}" rel="stylesheet">

  <!-- Scheme markers, inline and before first paint -- not a footer IIFE like
       the rest of the site's JS, because [data-scheme] has to already be
       correct by the time the browser paints, or a dark-mode visitor sees a
       frame of the light header image.

       .scheme-js gates the CSS fallback transition in _tailwind/main.css: it
       only applies when JS is off, so it needs to know JS is on to stay out
       of the way. .scheme-vt marks View Transition support the same way, for
       assets/js/themed-image-pairs.js to read without re-testing the API. -->
  <script>
    (function () {
      var root = document.documentElement;
      root.classList.add("scheme-js");
      if (typeof document.startViewTransition === "function") {
        root.classList.add("scheme-vt");
      }
      // Source of truth for the dark image layer once JS is present -- see
      // the :root[data-scheme="dark"] rule in _tailwind/main.css.
      root.dataset.scheme = window.matchMedia("(prefers-color-scheme: dark)").matches
        ? "dark"
        : "light";
    })();
  </script>

  <!--Favicon-->
  <link rel="shortcut icon" href="{{ '/assets/images/favicon.png' | relative_url }} " type="image/x-icon">
  <link rel="icon" href="{{ '/assets/images/favicon.png' | relative_url }} " type="image/x-icon">

  <!-- google analytics -->
  {% if site.data.settings.google-analytics %}
    {% include google-analytics.html %}
  {% endif %}

  <!-- google fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

  
  {%seo%}
</head>
