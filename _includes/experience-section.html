{% if site.data.settings.experience %}
<!-- experience -->
<section class="py-5 sm:py-20">
  <div class="container-page">
    <div class="flex flex-wrap -mx-3.75 justify-around">
      <div class="relative w-full px-3.75 text-center">
        <h2 class="text-h2 font-secondary mb-20">{{ site.data.settings.experience-title }}</h2>
      </div>
      {% for experience in site.data.settings.experience %}
      <div class="relative w-full px-3.75 text-center md:w-1/3 lg:w-1/4">
        <img class="mx-auto" src="{{ site.baseurl }}/assets/images/experience/{{ experience.icon }}" alt="{{ site.data.settings.experience-title }} icon">
        <p class="mb-0">{{ experience.date }}</p>
        <h4 class="text-h4 font-secondary">{{ experience.name }}</h4>
        <h6 class="text-h6 font-secondary text-muted">{{ experience.organization }}</h6>
      </div>
      {% endfor %}
    </div>
  </div>
</section>
<!-- ./experience -->
{% endif %}
