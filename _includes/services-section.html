{% if site.data.settings.services %}
<!-- services -->
<section class="py-5 sm:py-20">
  <div class="container-page">
    <div class="flex flex-wrap -mx-3.75">
      <div class="relative w-full px-3.75 text-center">
        <h2 class="text-h2 font-secondary mb-20">{{ site.data.settings.services-title }}</h2>
      </div>
      {% for service in site.data.settings.services %}
      <div class="relative w-full px-3.75 mb-6 md:mb-0 md:w-1/3">
        <div class="relative flex flex-col min-w-0 wrap-break-word rounded bg-surface bg-clip-border shadow-soft dark:shadow-black/50 transition-all duration-200 ease-[ease] hover:shadow-lift dark:hover:shadow-black/60">
          <div class="flex-auto text-center px-6 py-12 {% if service.active %}bg-primary transition-all duration-300 ease-[ease] **:text-white!{% endif %}">
            {% include ui/icon.html name=service.icon class="size-11 mb-12 inline-block" %}
            <h4 class="text-h4 font-secondary mb-6">{{ service.name }}</h4>
            <p>{{ service.description }}</p>
          </div>
        </div>
      </div>
      {% endfor %}
    </div>
  </div>
</section>
<!-- /services -->
{% endif %}
