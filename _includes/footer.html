<!-- footer -->
<footer class="bg-dark footer-section">
  <div class="section">
    <div class="container">
      <div class="row">
        <div class="col-lg-4 col-12">
          <h5 class="text-light">Email</h5>
          <p class="text-white paragraph-lg font-secondary">
            <a class="text-white" href="mailto:{{ site.data.settings.email }}">{{ site.data.settings.email }}</a>
          </p>
        </div>
        <div class="col-lg-4 col-12">
          <h5 class="text-light">Phone</h5>
          <p class="text-white paragraph-lg font-secondary">{{ site.data.settings.phone }}</p>
        </div>
        <div class="col-lg-4 col-12 socials-footer">
          <h5 class="text-light">Socials</h5><br/>
          {% for social in site.data.settings.social %}
          <li>
            <a class="text-white fs-3" href="{{ social.link }}">
              <i class="{{ social.icon }}"></i>
            </a>
          </li>
          {% endfor %}
        </div>
      </div>
    </div>
  </div>
  <div class="border-top text-center border-dark py-5">
    <p class="mb-0 text-light">{{site.data.settings.copyright | markdownify}}</p>
  </div>
</footer>
<!-- /footer -->


<!-- JS Plugins -->
{% for js in site.data.plugins.js %}
<script src="{{ js | relative_url }}"></script>
{% endfor %}

<!-- Main Script -->
<script src="{{ '/assets/js/script.js' | relative_url }}"></script>

<!-- Email Form Script -->
<script src="{{ '/assets/js/emailForm.js' | relative_url }}"></script>
