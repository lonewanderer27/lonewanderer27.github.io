{%- comment -%}
  Icon. Inline Tabler Icons (MIT), replacing the themify-icons webfont and the
  Font Awesome CDN kit.

  Params:
    name  - icon name, matching a `when` below; falls back to "medal"
    class - classes on the <svg>; pass a size-* utility, since the 24x24
            width/height attributes are dropped in favour of the class
    extra - extra classes appended verbatim

  Icons are inlined rather than loaded as a font because the site uses a
  dozen of them: the themify woff alone was 55KB, plus 13KB of CSS, to draw
  eight glyphs. Sizing is a size-* utility, not a font-size, so the old
  `text-[45px] leading-25!` line-height centring trick is gone -- wrap the
  call in `grid place-items-center` instead.

  Colour comes from `stroke="currentColor"`, so `text-*` utilities (and the
  semantic tokens that get re-pointed for dark mode) keep working unchanged.

  Every icon here is decorative and sits next to its own label, so they are
  all aria-hidden; give the *link* an aria-label where the icon is the only
  content.
{%- endcomment -%}

{%- assign icon_class = include.class | default: "size-6" -%}
{%- if include.extra -%}{%- assign icon_class = icon_class | append: " " | append: include.extra -%}{%- endif -%}

<svg class="{{ icon_class }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">{{ d }}</svg>
