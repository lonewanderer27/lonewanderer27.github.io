<!-- contact -->
<section class="py-5 sm:py-20 -mb-62.5 dots">
  <div class="container-page">
    <div class="flex flex-wrap -mx-3.75">
      {% if page.title != "Contact" %}
      <div class="relative w-full px-3.75 text-center">
        <h2 class="text-h2 font-secondary mb-20">{{ site.data.settings.contact-title }}</h2>
      </div>
      {% endif %}
      <div class="relative w-full px-3.75 mx-auto lg:w-2/3">
        <div class="material-thick rounded-card text-center p-12 shadow-sheet dark:shadow-none">
          <div id="contactFormAlert" class="hidden relative py-3 px-5 mb-4 rounded-control border border-[#c3e6cb] bg-[#d4edda] text-[#155724]" role="alert">
            &nbsp;<span>Thank you for your inquiry. I'll get in touch with you soon!</span>
            <span id="contactFormAlertBtn">{% include ui/icon.html name="x" class="size-4" %}</span>
          </div>

          <form class="flex flex-wrap -mx-3.75" id="contactForm">
            <div class="relative w-full px-3.75 md:w-1/2">
              <input type="text" id="name" name="name" placeholder="Full Name" class="block w-full h-15 py-1.5 px-0 mb-6 text-[1rem] leading-normal text-input-text bg-transparent border-b border-b-separator rounded-none focus:border-b-primary focus:outline-none" required>
            </div>
            <div class="relative w-full px-3.75 md:w-1/2">
              <input type="email" id="email" name="email" placeholder="Email Address" class="block w-full h-15 py-1.5 px-0 mb-6 text-[1rem] leading-normal text-input-text bg-transparent border-b border-b-separator rounded-none focus:border-b-primary focus:outline-none" required>
            </div>
            <div class="relative w-full px-3.75">
              <textarea name="message" id="message" class="block w-full h-30 py-1.5 px-0 mb-6 text-[1rem] leading-normal text-input-text bg-transparent border-b border-b-separator rounded-none focus:border-b-primary focus:outline-none"
                placeholder="Type Message Here" required></textarea>
            </div>
            <div class="relative px-3.75 mx-auto w-5/6 lg:w-1/2">
              {% include ui/button.html tag="button" type="submit" label="send" extra="w-full" %}
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>
<!-- /contact -->
