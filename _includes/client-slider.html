{% if site.data.settings.client-slider-items %}
<div class="client-logo-slider flex! items-center!">
  {% for slider-item in site.data.settings.client-slider-items %}
  <a href="{{ slider-item.url }}" class="text-center block outline-0 p-6">
    <img class="max-w-full h-auto w-[15vh] inline!" src="{{ site.baseurl }}/{{ slider-item.logo }}" alt="client-logo">
  </a>
  {% endfor %}
</div>
{% endif %}
