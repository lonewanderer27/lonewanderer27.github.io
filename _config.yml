title: Jay
description: Software Engineer from Philippines. Linux connoisseur. Digital freedom is what I fight for.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://lonewanderer27.github.io" # the base hostname & protocol for your site, e.g. http://example.com

defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/banner.png

destination: docs/

# Build settings
markdown: kramdown
permalink: pretty
plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from
  - jekyll-seo-tag
compress_html:
  clippings: all
  comments: all
  startings: [html, head, body]

# RSS Settings
feed:
  tags: true

# Pages Path
defaults:
  - scope:
      path: "_pages"
    values:
      permalink: /:basename:output_ext

include:
  - _pages

# Exclude from processing.
exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE.text
  - README.md
  - SECURITY.md
